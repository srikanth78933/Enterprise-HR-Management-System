<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Employee Details')}"></head>
<body>
<div class="app-wrapper">
    <aside th:replace="~{fragments/layout :: sidebar('employees')}"></aside>

    <div class="main-content">
        <header th:replace="~{fragments/layout :: topbar('Employee Details')}"></header>

        <main class="container-fluid p-3 p-lg-4">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="card">
                <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
                    <span>
                        <i class="bi bi-person-circle me-2"></i>
                        <span th:text="${employee.fullName}">Name</span>
                        <span class="badge ms-2"
                              th:classappend="${employee.status.name() == 'ACTIVE'} ? 'text-bg-success' : 'text-bg-secondary'"
                              th:text="${employee.status}">ACTIVE</span>
                    </span>
                    <div class="d-flex gap-2">
                        <a th:href="@{/employees/{id}/edit(id=${employee.id})}" class="btn btn-sm btn-primary">
                            <i class="bi bi-pencil me-1"></i>Edit
                        </a>
                        <form th:action="@{/employees/{id}/delete(id=${employee.id})}" method="post"
                              th:attr="data-confirm=|Are you sure you want to delete employee ${employee.fullName} (${employee.employeeCode})?|">
                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                <i class="bi bi-trash me-1"></i>Delete
                            </button>
                        </form>
                    </div>
                </div>
                <div class="card-body">
                    <div class="row g-4">
                        <div class="col-sm-6 col-lg-4">
                            <div class="details-label">Employee ID</div>
                            <div class="fw-semibold" th:text="${employee.employeeCode}">EMP001</div>
                        </div>
                        <div class="col-sm-6 col-lg-4">
                            <div class="details-label">First Name</div>
                            <div class="fw-semibold" th:text="${employee.firstName}">First</div>
                        </div>
                        <div class="col-sm-6 col-lg-4">
                            <div class="details-label">Last Name</div>
                            <div class="fw-semibold" th:text="${employee.lastName}">Last</div>
                        </div>
                        <div class="col-sm-6 col-lg-4">
                            <div class="details-label">Email</div>
                            <div class="fw-semibold">
                                <a th:href="'mailto:' + ${employee.email}" th:text="${employee.email}">email</a>
                            </div>
                        </div>
                        <div class="col-sm-6 col-lg-4">
                            <div class="details-label">Phone</div>
                            <div class="fw-semibold" th:text="${employee.phone != null} ? ${employee.phone} : '-'">-</div>
                        </div>
                        <div class="col-sm-6 col-lg-4">
                            <div class="details-label">Department</div>
                            <div class="fw-semibold" th:text="${employee.department.name}">IT</div>
                        </div>
                        <div class="col-sm-6 col-lg-4">
                            <div class="details-label">Job Title</div>
                            <div class="fw-semibold" th:text="${employee.jobTitle}">Engineer</div>
                        </div>
                        <div class="col-sm-6 col-lg-4">
                            <div class="details-label">Joining Date</div>
                            <div class="fw-semibold" th:text="${#temporals.format(employee.joiningDate, 'dd MMM yyyy')}">01 Jan 2024</div>
                        </div>
                        <div class="col-sm-6 col-lg-4">
                            <div class="details-label">Salary</div>
                            <div class="fw-semibold"
                                 th:text="${#numbers.formatDecimal(employee.salary, 1, 'COMMA', 2, 'POINT')}">0.00</div>
                        </div>
                    </div>
                </div>
                <div class="card-footer bg-white">
                    <a th:href="@{/employees}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-left me-1"></i>Back to employees
                    </a>
                </div>
            </div>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
