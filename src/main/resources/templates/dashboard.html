<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
<body>
<div class="app-wrapper">
    <aside th:replace="~{fragments/layout :: sidebar('dashboard')}"></aside>

    <div class="main-content">
        <header th:replace="~{fragments/layout :: topbar('Dashboard')}"></header>

        <main class="container-fluid p-3 p-lg-4">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <!-- Statistic cards -->
            <div class="row g-3 mb-4">
                <div class="col-12 col-sm-6 col-xl-3">
                    <div class="card stat-card h-100">
                        <div class="card-body d-flex justify-content-between align-items-center">
                            <div>
                                <div class="text-muted small text-uppercase">Total Employees</div>
                                <div class="stat-value text-primary" th:text="${totalEmployees}">0</div>
                            </div>
                            <i class="bi bi-people stat-icon text-primary"></i>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-sm-6 col-xl-3">
                    <div class="card stat-card stat-info h-100">
                        <div class="card-body d-flex justify-content-between align-items-center">
                            <div>
                                <div class="text-muted small text-uppercase">Total Departments</div>
                                <div class="stat-value text-info-emphasis" th:text="${totalDepartments}">0</div>
                            </div>
                            <i class="bi bi-building stat-icon text-info"></i>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-sm-6 col-xl-3">
                    <div class="card stat-card stat-success h-100">
                        <div class="card-body d-flex justify-content-between align-items-center">
                            <div>
                                <div class="text-muted small text-uppercase">Active Employees</div>
                                <div class="stat-value text-success" th:text="${activeEmployees}">0</div>
                            </div>
                            <i class="bi bi-person-check stat-icon text-success"></i>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-sm-6 col-xl-3">
                    <div class="card stat-card stat-muted h-100">
                        <div class="card-body d-flex justify-content-between align-items-center">
                            <div>
                                <div class="text-muted small text-uppercase">Inactive Employees</div>
                                <div class="stat-value text-secondary" th:text="${inactiveEmployees}">0</div>
                            </div>
                            <i class="bi bi-person-dash stat-icon text-secondary"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Recent employees -->
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span><i class="bi bi-clock-history me-2"></i>Recent Employees</span>
                    <a th:href="@{/employees}" class="btn btn-sm btn-outline-primary">View all</a>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead>
                            <tr>
                                <th>Employee ID</th>
                                <th>Name</th>
                                <th>Department</th>
                                <th>Job Title</th>
                                <th>Joining Date</th>
                                <th>Status</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="emp : ${recentEmployees}">
                                <td th:text="${emp.employeeCode}">EMP001</td>
                                <td>
                                    <a th:href="@{/employees/{id}(id=${emp.id})}" th:text="${emp.fullName}">Name</a>
                                </td>
                                <td th:text="${emp.department.name}">IT</td>
                                <td th:text="${emp.jobTitle}">Engineer</td>
                                <td th:text="${#temporals.format(emp.joiningDate, 'dd MMM yyyy')}">01 Jan 2024</td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${emp.status.name() == 'ACTIVE'} ? 'text-bg-success' : 'text-bg-secondary'"
                                          th:text="${emp.status}">ACTIVE</span>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(recentEmployees)}">
                                <td colspan="6" class="text-center text-muted py-4">
                                    No employees yet.
                                    <a th:href="@{/employees/new}">Add the first employee</a>.
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
