<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<!-- Shared <head>: page title, Bootstrap 5, Bootstrap Icons and the app stylesheet -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | Enterprise HR Portal'">Enterprise HR Portal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- Sidebar navigation. Shown permanently on large screens and as a slide-in menu on small screens. -->
<aside th:fragment="sidebar(active)" class="sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="sidebar">
    <div class="offcanvas-header">
        <span class="sidebar-brand"><i class="bi bi-people-fill me-2"></i>EHR</span>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                data-bs-target="#sidebar" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
        <div class="w-100">
            <a th:href="@{/}" class="sidebar-brand d-none d-lg-block">
                <i class="bi bi-people-fill me-2"></i>EHR
            </a>
            <nav class="nav flex-column">
                <a th:href="@{/}" class="nav-link" th:classappend="${active == 'dashboard'} ? 'active'">
                    <i class="bi bi-speedometer2 me-2"></i>Dashboard
                </a>
                <a th:href="@{/employees}" class="nav-link" th:classappend="${active == 'employees'} ? 'active'">
                    <i class="bi bi-person-badge me-2"></i>Employees
                </a>
                <a th:href="@{/employees/new}" class="nav-link ps-5 small"
                   th:classappend="${active == 'employee-new'} ? 'active'">
                    <i class="bi bi-person-plus me-2"></i>Add Employee
                </a>
                <a th:href="@{/departments}" class="nav-link" th:classappend="${active == 'departments'} ? 'active'">
                    <i class="bi bi-building me-2"></i>Departments
                </a>
                <a th:href="@{/departments/new}" class="nav-link ps-5 small"
                   th:classappend="${active == 'department-new'} ? 'active'">
                    <i class="bi bi-plus-square me-2"></i>Add Department
                </a>
            </nav>
        </div>
    </div>
</aside>

<!-- Top navigation bar with the page title -->
<header th:fragment="topbar(title)" class="topbar navbar bg-white border-bottom px-3 px-lg-4">
    <div class="d-flex align-items-center">
        <button class="btn btn-outline-primary d-lg-none me-3" type="button"
                data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-controls="sidebar"
                aria-label="Open menu">
            <i class="bi bi-list"></i>
        </button>
        <h1 class="h5 mb-0 text-primary-emphasis" th:text="${title}">Page</h1>
    </div>
    <div class="d-flex align-items-center text-muted small">
        <span class="d-none d-sm-inline me-3">Enterprise HR Portal</span>
        <i class="bi bi-calendar3 me-1"></i>
        <span th:text="${#temporals.format(#temporals.createToday(), 'dd MMM yyyy')}">01 Jan 2026</span>
    </div>
</header>

<!-- Success / error messages passed with RedirectAttributes.addFlashAttribute(...) -->
<div th:fragment="alerts">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}">Success</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}">Error</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>

<!-- Scripts loaded at the end of every page -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</th:block>

</body>
</html>
