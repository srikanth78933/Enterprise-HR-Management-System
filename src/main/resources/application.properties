# ---------------------------------------------------------------
# Application
# ---------------------------------------------------------------
spring.application.name=enterprise-hr-portal
server.port=${SERVER_PORT:8080}
# Keep session IDs in cookies only (never appended to URLs as ;jsessionid=...)
server.servlet.session.tracking-modes=cookie

# ---------------------------------------------------------------
# PostgreSQL (all values come from environment variables)
# The same settings work for local PostgreSQL and AWS RDS PostgreSQL.
# DB_PASSWORD has no default on purpose: it must be provided.
# ---------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:employee_db}?sslmode=${DB_SSL_MODE:prefer}
spring.datasource.username=${DB_USERNAME:employee_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10

# ---------------------------------------------------------------
# JPA / Hibernate
# Flyway owns the schema; Hibernate only checks that entities match it.
# ---------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------------------------------------------------------------
# Flyway (scripts in src/main/resources/db/migration)
# ---------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------
# Error handling: never show stack traces to users
# ---------------------------------------------------------------
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

# ---------------------------------------------------------------
# Actuator health checks
#   /actuator/health            overall health (includes database)
#   /actuator/health/liveness   liveness probe
#   /actuator/health/readiness  readiness probe (includes database)
# ---------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# Graceful shutdown lets in-flight requests finish when the app is stopped
server.shutdown=graceful
